# AgentTune configuration actually used for the Colab L4 run (LL-2.ipynb).
# Documentation only: train_real_agenttune.py passes these values directly as
# arguments (see its argparse defaults); this file is not parsed by any script.

project:
  name: "ledgertune-double-entry-ledger-agent"
  track: "Track 3: Agentic Fine-Tuning"
  hardware: "1x NVIDIA L4 (24 GB), Google Colab"

model:
  base_model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  use_peft: true
  lora_config:
    r: 16
    lora_alpha: 32
    target_modules: "all-linear"

dataset:
  sft_train_file: "data/agenttune_eventlog_sft_train.jsonl"   # 130 episodes, EventLog.as_dataset_rows("sft")
  validation_file: "data/agenttune_sft_val.jsonl"             # 25 held-out episodes
  tool_schema_file: "src/phase1_architecture/tool_schemas.json"

stage1_sft:                      # agenttune.create_distill_trainer
  num_train_epochs: 3            # 51 optimizer steps
  per_device_train_batch_size: 2
  learning_rate: 2.0e-4
  logging_steps: 5

stage2_grpo:                     # agenttune.core.backend_factory.create_agentic_trainer("grpo")
  max_steps: 40
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_generations: 2
  max_steps_per_turn: 8
  max_completion_length: 1024
  learning_rate: 5.0e-6
  reward_function:
    module: "src.phase3_agenttune.reward_functions"
    callable: "agenttune_grpo_reward_fn"
    components:                  # max contribution of each term; total in [-0.5, 1.0]
      r_syntax: 0.25
      r_accounting: 0.30
      r_statechart: 0.30         # can go to -0.50 for committing after a rejection
      r_efficiency: 0.15
  known_issue: >
    In the recorded run GRPO was initialised from the base model and logged train_loss 0.0
    (no learning). The script now merges the SFT adapter before GRPO; not yet re-run.
